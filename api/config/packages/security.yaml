security:
    password_hashers:
        # « auto » = algorithme recommandé par PHP (bcrypt ou argon2id), re-haché automatiquement s'il évolue.
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # POST /api/login {"email", "password"} → {"token": "…"} (jeton JWT signé, durée : JWT_TOKEN_TTL)
        login:
            pattern: ^/api/login$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # 5 essais ratés par adresse e-mail et par IP en 15 minutes, puis blocage temporaire
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
        # Toutes les autres routes /api : en-tête « Authorization: Bearer <jeton> » obligatoire, pas de session
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
